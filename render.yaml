services:
  - type: web
    name: nationsub-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FIREBASE_PROJECT_ID
        value: nationsub-84906
      - key: VTU_API_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
